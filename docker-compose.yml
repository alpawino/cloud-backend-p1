version: '3.8'

services:
  # ==========================================
  # MS 1: USUARIOS (Python/FastAPI)
  # ==========================================
  users-api:
    build: ./users-service
    container_name: users-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:root@172.31.82.16:3306/usersdb

  # ==========================================
  # MS 2: PRODUCTOS (Node.js)
  # ==========================================
  productos-api:
    build: ./productos-service
    container_name: productos-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: mongodb://172.31.82.16:27017/productsDB

  # ==========================================
  # MS 3: ÓRDENES (Java/Spring Boot)
  # ==========================================
  orders-api:
    build: ./orders-service
    container_name: orders-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://172.31.82.16:5432/orders_db
      - DB_USERNAME=root
      - DB_PASSWORD=root

  # ==========================================
  # MS 4: HISTORIAL (Agregador)
  # ==========================================
  history-api:
    build: ./history-service
    container_name: history-api
    restart: always
    ports:
      - "8001:8001"
    environment:
      - USERS_URL=http://users-api:8000
      - ORDERS_URL=http://orders-api:8083
      
  # ==========================================
  # MS 5: INGESTA / ANALYTICS (Worker)
  # ==========================================
  analytics-worker:
    build: ./analytics-worker
    container_name: analytics-worker
    # No exponemos puertos porque es un script que corre de fondo y muere
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - S3_BUCKET=ingesta-proyecto-final-2026
